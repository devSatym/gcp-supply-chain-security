apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supply-chain-azure-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devSatym/gcp-supply-chain-security.git
    targetRevision: main
    path: k8s/azure/supply-chain-demo
    helm:
      releaseName: supply-chain-demo
      valueFiles:
        - values.release.yaml
      ignoreMissingValueFiles: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # The base chart is inert while values.release.yaml is absent. The trusted
  # main promotion job creates that file only after verification and locking.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
