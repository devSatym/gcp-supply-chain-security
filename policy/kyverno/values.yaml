# Helm values for the Kyverno release installed into the GKE cluster.
#
# The admission controller reads Cosign signatures and attestations from GAR.
# It uses this GSA via GKE Workload Identity; the Terraform root grants that
# GSA repository-scoped reader access and permits only this KSA to impersonate
# it. No JSON key is created or stored.
config:
  maxContextSize: 8Mi

admissionController:
  rbac:
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: kyverno-verifier@valiant-house-502004-k2.iam.gserviceaccount.com
