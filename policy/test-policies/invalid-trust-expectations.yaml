# Test-only policy. It matches only the labelled fixture in
# ../test-manifests/test-invalid-trust.yaml and deliberately specifies an
# incorrect signer identity and provenance source URI. Apply it briefly when
# capturing an enforcement test, then delete it immediately afterwards.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: test-invalid-trust-expectations
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: reject-wrong-keyless-identity
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  supply-chain-security-test: invalid-trust
      verifyImages:
        - imageReferences:
            - "europe-west1-docker.pkg.dev/valiant-house-502004-k2/supply-chain-security/*"
          repository: "europe-west1-docker.pkg.dev/valiant-house-502004-k2/supply-chain-security-attestations/supply-chain-demo"
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/devSatym/gcp-supply-chain-security/.github/workflows/not-the-signing-workflow.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          mutateDigest: false
          verifyDigest: true
          required: true

    - name: reject-wrong-provenance-source
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  supply-chain-security-test: invalid-trust
      verifyImages:
        - imageReferences:
            - "europe-west1-docker.pkg.dev/valiant-house-502004-k2/supply-chain-security/*"
          repository: "europe-west1-docker.pkg.dev/valiant-house-502004-k2/supply-chain-security-attestations/supply-chain-demo"
          attestations:
            - type: https://slsa.dev/provenance/v0.2
              attestors:
                - entries:
                    - keyless:
                        subject: "https://github.com/devSatym/gcp-supply-chain-security/.github/workflows/sign-attest.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ invocation.configSource.uri }}"
                      operator: Equals
                      value: "git+https://github.com/devSatym/untrusted-fork@refs/heads/main"
          mutateDigest: false
          verifyDigest: true
          required: true
