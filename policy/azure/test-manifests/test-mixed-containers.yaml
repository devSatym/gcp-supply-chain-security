apiVersion: v1
kind: Pod
metadata:
  name: test-azure-mixed-containers
  labels:
    test: azure-mixed
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: signer-init
      image: example.azurecr.io/supply-chain-security/supply-chain-demo@sha256:4444444444444444444444444444444444444444444444444444444444444444
      command: ["sh", "-c", "echo init done"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  containers:
    - name: signed-app
      image: example.azurecr.io/supply-chain-security/supply-chain-demo@sha256:5555555555555555555555555555555555555555555555555555555555555555
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
    - name: unsigned-sidecar
      image: example.azurecr.io/supply-chain-security/supply-chain-demo@sha256:6666666666666666666666666666666666666666666666666666666666666666
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
