apiVersion: v1
kind: Pod
metadata:
  name: test-azure-unsigned-image
  labels:
    test: azure-unsigned
spec:
  restartPolicy: Never
  containers:
    - name: unsigned-app
      # Matches the rendered ClusterPolicy imageReferences but has no Cosign
      # signature in the metadata repository: admission must reject it.
      image: example.azurecr.io/supply-chain-security/supply-chain-demo@sha256:1111111111111111111111111111111111111111111111111111111111111111
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
