apiVersion: v1
kind: Pod
metadata:
  name: test-init-unsigned
  labels:
    test: mixed-signed-unsigned
spec:
  initContainers:
    - name: unsigned-init
      image: europe-west1-docker.pkg.dev/valiant-house-502004-k2/supply-chain-security/supply-chain-demo:unsigned-test
      command: ["sh", "-c", "echo init done"]
