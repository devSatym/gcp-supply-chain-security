name: Azure SBOM and VEX

on:
  workflow_call:

# The SBOM job requests repository read access explicitly below.
permissions: {}

jobs:
  cdxgen:
    name: Azure CycloneDX SBOM and reachability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate CycloneDX SBOM and atom evidence
        run: |
          set -Eeuo pipefail
          chmod o+w "${{ github.workspace }}"
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/cyclonedx/cdxgen@sha256:29babac410b88a53c8fa60038b1b9a5c26764ccb84942ca77863acf90c86e288 \
            -t python --deep --evidence -o /repo/bom.cdx.json /repo/app
          python3 -c 'import json; print(len(json.load(open("bom.cdx.json"))["components"]))'

      - name: Run non-blocking reachability analysis
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          mkdir -p reports && chmod 777 reports
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ github.workspace }}/reports:/reports" \
            -w /repo \
            ghcr.io/owasp-dep-scan/dep-scan@sha256:2c4e664db8637442e06603fab2caf1484acef5556fd7fb63a9950f824b2bcec7 \
            depscan --profile research -t python --bom /repo/bom.cdx.json \
            --src /repo/app --reports-dir /reports --no-vuln-table

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: azure-sbom-vex-${{ github.sha }}
          path: |
            bom.cdx.json
            reports/
          retention-days: 90
