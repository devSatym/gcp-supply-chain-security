name: PR Check

on:
  pull_request:
    branches:
      - main
    # No paths filter here on purpose. A path-filtered trigger means the
    # whole workflow never runs at all for a commit outside those paths --
    # GitHub then leaves the required checks stuck "Pending" forever for
    # that commit, permanently blocking merge (confirmed firsthand: this is
    # exactly what happened when Helm chart changes landed in a path this
    # filter didn't cover). Skipping is instead handled per-job below via
    # `if:`, since a job skipped by a conditional correctly reports
    # "skipped" -- which GitHub treats as a passing required check -- while
    # a workflow that never triggers reports nothing at all.

permissions:
  contents: read
  security-events: write
  pull-requests: read  # required by dorny/paths-filter to read the PR diff

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            relevant:
              - 'app/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'policy/**'
              - 'terraform/**'
              - 'infrastructure/**'
              - 'k8s/helm/**'
              - 'CODEOWNERS'
              - '.github/CODEOWNERS'

  security-scan:
    name: Security Scan
    needs: changes
    uses: ./.github/workflows/security-scan.yml
    with:
      fail-on-findings: true
      run-scan: ${{ needs.changes.outputs.relevant == 'true' }}

  policy-test:
    name: Policy Unit Tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python3 -m pip install jmespath pyyaml

      - name: Check certificate identity consistency across all policy/CI files
        run: bash policy/tests/check-identity-consistency.sh

      - name: Verify Kyverno Rule 3 conditions against a real provenance predicate
        run: python3 policy/tests/test_jmespath_conditions.py

  pr-image-scan:
    name: PR Image Scan
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build image for local scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: supply-chain-demo:pr-${{ github.sha }}

      - name: Scan PR image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: supply-chain-demo:pr-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-image.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true

      - name: Upload PR image scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
