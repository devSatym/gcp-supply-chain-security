name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a manual build/sign/attest run'
        required: true
        type: string

# Prevent overlapping deploy runs from racing to sign/attest against
# the same or adjacent commits. Queue rather than cancel, since killing
# a signing operation mid-flight could leave a partially-attested image.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  build-push:
    name: Build and Push
    # On a real push this always runs. On workflow_dispatch (e.g. re-signing
    # after a Sigstore outage), it only runs if the confirm input matches --
    # a one-click "Run workflow" button with no guard would let anyone with
    # write access silently trigger a full rebuild-and-resign.
    # workflow_dispatch lets a maintainer select a ref in the UI. Keep all
    # WIF/GAR authority on canonical main even when the confirmation is valid.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.confirm == 'deploy')
    uses: ./.github/workflows/build-push.yml
    with:
      image-tag: ${{ github.sha }}
      push: true
      gar_location: ${{ vars.GAR_LOCATION }}
      gar_project_id: ${{ vars.GAR_PROJECT_ID }}
      gar_repository: ${{ vars.GAR_REPOSITORY }}
      workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.GCP_SA_EMAIL }}


  sbom-vex:
    name: SBOM and VEX (non-blocking)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.confirm == 'deploy')
    uses: ./.github/workflows/sbom-vex.yml

  sign-attest:
    name: Sign and Attest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sign-attest.yml
    with:
      digest: ${{ needs.build-push.outputs.digest }}
      gar_location: ${{ vars.GAR_LOCATION }}
      gar_project_id: ${{ vars.GAR_PROJECT_ID }}
      gar_repository: ${{ vars.GAR_REPOSITORY }}
      cosign_repository: ${{ vars.COSIGN_REPOSITORY }}
      workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.GCP_SA_EMAIL }}
  

  verify:
    name: Verify
    needs: [build-push, sign-attest]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
    with:
      digest: ${{ needs.build-push.outputs.digest }}
      gar_location: ${{ vars.GAR_LOCATION }}
      gar_project_id: ${{ vars.GAR_PROJECT_ID }}
      gar_repository: ${{ vars.GAR_REPOSITORY }}
      cosign_repository: ${{ vars.COSIGN_REPOSITORY }}
      workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.GCP_SA_EMAIL }}
