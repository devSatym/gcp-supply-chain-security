version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infrastructure/azure/environments/prod
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infrastructure/azure/bootstrap-state
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infrastructure/azure/private-runner
    schedule:
      interval: weekly
