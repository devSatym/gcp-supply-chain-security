apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "supply-chain-demo.fullname" . }}-default-deny
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "supply-chain-demo.name" . }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "supply-chain-demo.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
{{- range .Values.networkPolicy.allowedIngressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
