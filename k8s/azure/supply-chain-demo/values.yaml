# Argo CD can safely install this chart before a release exists. The trusted
# main promotion job supplies values.release.yaml and enables the workload only
# after the image has been signed, attested, verified, and locked.
workload:
  enabled: false

namespace:
  name: supply-chain
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted

replicaCount: 2

image:
  repository: "${ACR_LOGIN_SERVER}/${ACR_APPLICATION_REPOSITORY}"
  digest: "${IMAGE_DIGEST}"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

containerPort: 8000

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10

networkPolicy:
  # AKS node and Azure CNI overlay Pod ranges. Only in-cluster calls through
  # Service/port-forward are accepted; no public LoadBalancer is created.
  allowedIngressCIDRs:
    - 10.20.0.0/16
    - 10.244.0.0/16

pdb:
  minAvailable: 1
